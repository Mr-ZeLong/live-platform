version: '3'
services:
  live-api-docker-1:
    container_name: live-api-docker-1
    image: 'live-api-docker:1.0'
    ports:
      - "8081:8081"
    volumes:
      - /tmp/logs/live-api:/tmp/logs/live-api
    environment:
      - spring.cloud.nacos.discovery.ip=192.168.0.254
      - TZ=Asia/Shanghai
      - server.port=8081
      - JAVA_OPTS=-DNACOS_USER=nacos -DNACOS_PWD=nacos -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=128m -Xms512m -Xmx512m -Xmn128m -Xss256k
    extra_hosts:
      - 'live-server:192.168.0.254'

  live-api-docker-2:
    container_name: live-api-docker-2
    image: 'live-api-docker:1.0'
    ports:
      - "8082:8082"
    volumes:
      - /tmp/logs/live-api:/tmp/logs/live-api
    environment:
      - spring.cloud.nacos.discovery.ip=192.168.0.254
      - TZ=Asia/Shanghai
      - server.port=8082
      - JAVA_OPTS=-DNACOS_USER=nacos -DNACOS_PWD=nacos -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=128m -Xms512m -Xmx512m -Xmn128m -Xss256k
    extra_hosts:
      - 'live-server:192.168.0.254'